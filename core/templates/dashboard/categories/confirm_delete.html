{% extends "dashboard/base_dashboard.html" %}

{% block title %}حذف دسته | داشبورد{% endblock %}
{% block dash_title %}حذف دسته‌بندی{% endblock %}

{% block dash_content %}
<div class="dash-card confirm-card">
    <div class="confirm-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h2>حذف «{{ object.name }}»؟</h2>
    <p>محصولات این دسته نیز تحت تأثیر قرار می‌گیرند.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions center">
            <button type="submit" class="btn-danger-dash">بله، حذف شود</button>
            <a href="{% url 'dashboard:categories' %}" class="btn-secondary-dash">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
