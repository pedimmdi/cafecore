{% load static %}
<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="{% block description %}کافه رستوران{% endblock %}">

    <meta name="keywords"
          content="{% block keywords %}کافه, رستوران, قهوه, غذا{% endblock %}">

    <meta name="author"
          content="CafeCore">

    <title>

        {% block title %}
            کافه رستوران
        {% endblock %}

    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->

    <link rel="icon" type="image/svg+xml"
          href="{% static 'images/icons/logo.svg' %}">

    <!-- Includes CSS -->

    <link rel="stylesheet"
          href="{% static 'css/includes/navbar.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/includes/footer.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/includes/messages.css' %}">

    {% block css %}

    {% endblock %}

</head>

<body>

{% include "includes/navbar.html" %}

{% include "includes/messages.html" %}

<main id="main-content">

    {% block content %}

    {% endblock %}

</main>

{% include "includes/footer.html" %}

<!-- Includes JS -->

<script src="{% static 'js/includes/navbar.js' %}"></script>

<script src="{% static 'js/includes/footer.js' %}"></script>

<script src="{% static 'js/includes/messages.js' %}"></script>

{% block js %}

{% endblock %}

</body>

</html>
